# ==============================================================================
# Merlin-CI Configuration File (merlin-ci.conf)
# ==============================================================================
# Location: /jffs/addons/merlin-ci/merlin-ci.conf or USB storage

# --- General & Embedded Settings ---
MCI_ENABLED=1

# Embedded Optimization: 1 = Lean memory/CPU mode for embedded routers
MCI_EMBEDDED_MODE=1

# Execution Mode: "cron" (zero resident background RAM) or "daemon"
MCI_EXEC_MODE="cron"
MCI_CRON_SCHEDULE="0 4 * * *"

# Storage Locations on USB (Never raw JFFS to prevent flash wear!)
MCI_LOG_DIR="/opt/var/merlin-ci/logs"
MCI_BACKUP_DIR="/opt/var/merlin-ci/backups"

# Maximum number of build/job logs to keep
MCI_MAX_LOG_HISTORY=10

# --- Router Safety Guardrails ---
# Maximum 1-minute load average before execution is deferred
MCI_MAX_LOADAVG="2.50"

# Minimum free RAM (MB) required before launching a job
MCI_MIN_FREE_RAM_MB=32

# Job timeout in seconds
MCI_JOB_TIMEOUT=600

# Process Priority (19 = lowest CPU scheduling priority)
MCI_NICE_LEVEL=19

# --- Notifications ---
# Email Notifications:
# If AMTM Email ('em') or @Martinski's SendEmail ('se') is configured on the router,
# Merlin-CI automatically inherits your encrypted AMTM email setup out of the box
# with ZERO plaintext credentials required below!
MCI_EMAIL_ENABLED=1

# Email Transport Mode:
# "auto" = Uses @Martinski's SendEmail ('se') if installed, otherwise built-in HTML/MIME via AMTM 'em'
# "1"    = Force @Martinski SendEmail (/jffs/scripts/SendEmail or CustomEMailFunctions.lib.sh)
# "0"    = Force built-in Multipart HTML Executive Dashboard + Plain-Text MIME dispatcher
MCI_USE_SENDEMAIL="auto"

# Optional Custom SMTP Override (Leave blank to auto-inherit from AMTM /jffs/addons/amtm/mail/email.conf)
MCI_SMTP_SERVER=""
MCI_SMTP_PORT=465
MCI_SMTP_USER=""
MCI_SMTP_PASS=""
MCI_SMTP_FROM=""
MCI_SMTP_TO=""
MCI_SMTP_TLS=1

# Notification Policies:
# 0 = Silent on routine passes (batch all results into single morning digest)
# 1 = Send email on every single job success
MCI_NOTIFY_ON_SUCCESS=0

# 1 = Immediately dispatch alert email if a job fails or rolls back
MCI_NOTIFY_ON_FAILURE=1

# 1 = Immediately dispatch alert email if a watchdog detects an anomaly and executes self-healing
MCI_NOTIFY_ON_HEAL=1

# Webhooks
MCI_DISCORD_WEBHOOK_URL=""
MCI_TELEGRAM_BOT_TOKEN=""
MCI_TELEGRAM_CHAT_ID=""

# --- IoT Anomaly Defender (iot-anomaly-contain) ---
# Subnet prefix for monitored IoT devices (default: 192.168.53.)
MCI_IOT_SUBNET_PREFIX="192.168.53."

# Connection ceiling for IoT sensors before containment triggers (default: 20)
MCI_IOT_MAX_CONNS=20

# Excluded non-IoT devices on IoT VLAN (space-separated list of IPs, MACs, or names)
MCI_IOT_EXCLUDE="192.168.53.144 fe:01:d0:ea:bd:c1 SM-L310 Galaxy-Watch7 192.168.53.2 38:8c:ef:2c:3c:9e HW-S801D Samsung"

# --- AMTM Auto-Update Guardrails ---
# Space-separated list of scripts explicitly excluded from general autoupdates
# amtm core and MerlinAU (disabled by default) are permanently excluded.
# Any script marked with '#' or '##' in /jffs/addons/amtm/amtmUpdateScripts is also automatically skipped.
MCI_EXCLUDE_SCRIPTS="amtm MerlinAU merlinau"

